id: password-visibility
title: Reveal typed password before submitting
prompt: >-
  On the login screen, users often mistype their password. Let them check
  what they've typed before submitting.
rubrics:
  - id: builtin-affordance
    text: >-
      Builds the password field on the design system's input component, using
      its built-in slots for the visibility control, rather than hand-rolling
      a bare input element with a separate button bolted on
    weight: 0.5
    critical: true
  - id: accessible-toggle
    text: >-
      The visibility control is accessible: its accessible name reflects the
      current state
    weight: 0.3
  - id: no-leak
    text: The password value is never logged or echoed elsewhere in the UI
    weight: 0.2
